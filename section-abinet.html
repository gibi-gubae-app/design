<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>አብነት እና ግዕዝ · Abinet & Ge'ez</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/prefs.js"></script>
<script src="assets/form.js"></script>
</head>
<body data-none="በዚህ ሳምንት ትምህርት አልነበረም">
<header class="appbar"><div class="row">
  <a href="weekly-report.html" class="icon-btn -ml-2 text-inherit" aria-label="ተመለስ"><span class="ms">arrow_back</span></a>
  <h1>አብነት እና ግዕዝ</h1>
  <span class="pill saved"><span class="ms" style="font-size:14px">cloud_done</span>ተቀምጧል</span>
</div></header>

<main class="relative overflow-hidden px-4 pt-[64px] pb-32">
  <div class="glow" style="height:300px"></div>
  <div class="layer flex flex-col gap-3.5">
    <p class="section-note"><span class="ms" style="font-size:16px">info</span>ቀጣይነት ያለው ትምህርት፤ ግቢ ጉባኤው የሚሰጣቸውን ይምረጡ።</p>
    <div id="list" class="flex flex-col gap-3.5"></div>
    <button class="btn btn-ghost" id="add" type="button" style="height:46px"><span class="ms" style="font-size:20px">add</span>ሌላ የትምህርት ቡድን ጨምር</button>
  </div>
</main>

<div class="actionbar"><button class="btn btn-primary" type="button" onclick="location.href='weekly-report.html'"><span class="ms" style="font-size:20px">check</span>ጨርሻለሁ</button></div>

<script>
const LESSONS = ['ግዕዝ ቋንቋ', 'ቅዳሴ', 'ዜማ', 'ሰዓታት', 'ውዳሴ ማርያም', 'ኪዳን'];
const PER_WEEK = ['1 ቀን', '2 ቀን', '3 ቀን', '4 ቀን', '5 ቀን', '6 ቀን', 'በየቀኑ'];
F.repeater({
  list: document.getElementById('list'), addBtn: document.getElementById('add'), title: 'የትምህርት ቡድን',
  body: d => `
    ${F.multi('የሚሰጡ ትምህርቶች', LESSONS, d.lessons ?? [], 'f-lessons', '· ከአንድ በላይ ይቻላል')}
    ${F.attendance(d.m ?? 0, d.f ?? 0, 'የተገኙ ተማሪዎች')}
    ${F.date('ቀን', d.date ?? 'ኅዳር 13, 2019')}
    ${F.choice('በሳምንት የሚማሩበት ቀን ብዛት', PER_WEEK, d.days, '', 'f-days', false)}
    ${F.hours('በቀን የሚወስደው ሰዓት', d.hours ?? '')}
    ${F.teacher('መምህር', d.tType, d.tName ?? '')}
    ${F.more(F.problems(d.p ?? '', d.s ?? '') + F.area('ተጨማሪ መረጃ', d.note ?? '', 'ተጨማሪ መረጃ ካለ ይጻፉ…'), 'ችግር፣ መፍትሄ እና ተጨማሪ')}`,
  summary: c => `${F.multiOf(c, '.f-lessons').join('፣ ') || 'ትምህርት አልተመረጠም'} · ${F.picked(c, '.f-days')} · ${F.total(c)} ተማሪዎች`,
  items: [{ lessons: ['ግዕዝ ቋንቋ', 'ቅዳሴ'], days: '3 ቀን', hours: 2, tType: 'የደብሩ', tName: 'መሪጌታ ገብረ ሥላሴ', m: 10, f: 8 }],
});
</script>
<script src="assets/section.js"></script>
</body>
</html>
