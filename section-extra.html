<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ተጨማሪ ተግባራት · Additional activities</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/prefs.js"></script>
<script src="assets/form.js"></script>
</head>
<body>
<header class="appbar"><div class="row">
  <a href="weekly-report.html" class="icon-btn -ml-2 text-inherit" aria-label="ተመለስ"><span class="ms">arrow_back</span></a>
  <h1>ተጨማሪ ተግባራት</h1>
  <span class="pill saved"><span class="ms" style="font-size:14px">cloud_done</span>ተቀምጧል</span>
</div></header>

<main class="relative overflow-hidden px-4 pt-[64px] pb-32">
  <div class="glow" style="height:300px"></div>
  <div class="layer flex flex-col gap-3.5">
    <p class="section-note"><span class="ms" style="font-size:16px">info</span>በቅጹ ላይ የሌሉ ሌሎች ተግባራት ካሉ እዚህ ይመዝግቡ። (አማራጭ)</p>
    <div id="list" class="flex flex-col gap-3.5"></div>
    <button class="btn btn-ghost" id="add" type="button" style="height:46px"><span class="ms" style="font-size:20px">add</span>ሌላ ተግባር ጨምር</button>
  </div>
</main>

<div class="actionbar"><button class="btn btn-primary" type="button" onclick="location.href='weekly-report.html'"><span class="ms" style="font-size:20px">check</span>ጨርሻለሁ</button></div>

<script>
F.repeater({
  list: document.getElementById('list'), addBtn: document.getElementById('add'), title: 'ተግባር',
  body: d => `
    ${F.text('የተግባሩ ስም', d.name ?? '', 'ለምሳሌ፡ የበጎ አድራጎት ጉብኝት', 'topic')}
    ${F.attendance(d.m ?? 0, d.f ?? 0, 'ተሳታፊዎች')}
    ${F.date('ቀን', d.date ?? 'ኅዳር 16, 2019')}
    ${F.area('መግለጫ', d.desc ?? '', 'ምን እንደተከናወነ በአጭሩ…')}
    ${F.more(F.hours('የወሰደው ሰዓት', d.hours ?? '') + F.area('ውጤት', d.result ?? '', 'የተገኘው ውጤት…') + F.problems() +
      `<button type="button" class="more-btn" style="border-style:solid"><span class="ms">attach_file</span><span>ፋይል / ፎቶ አያይዝ</span></button>`, 'ተጨማሪ መረጃ')}`,
  summary: c => `${F.val(c, '.topic') || 'ስም አልተጻፈም'} · ${F.total(c)} ተሳታፊ`,
  items: [{ name: 'የሕሙማን ጉብኝት', desc: 'በጥቁር አንበሳ ሆስፒታል ሕሙማንን ጎብኝተናል', m: 6, f: 9 }],
});
</script>
<script src="assets/section.js"></script>
</body>
</html>
