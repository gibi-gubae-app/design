<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ተከታታይ ኮርሶች · Continuous courses</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/prefs.js"></script>
<script src="assets/form.js"></script>
</head>
<body data-none="በዚህ ሳምንት ኮርስ አልነበረም">
<header class="appbar"><div class="row">
  <a href="weekly-report.html" class="icon-btn -ml-2 text-inherit" aria-label="ተመለስ"><span class="ms">arrow_back</span></a>
  <h1>ተከታታይ ኮርሶች</h1>
  <span class="pill saved"><span class="ms" style="font-size:14px">cloud_done</span>ተቀምጧል</span>
</div></header>

<main class="relative overflow-hidden px-4 pt-[64px] pb-32">
  <div class="glow" style="height:300px"></div>
  <div class="layer flex flex-col gap-3.5">
    <p class="section-note"><span class="ms" style="font-size:16px">info</span>በዚህ ሳምንት የተሰጡ ተከታታይ ኮርሶች። የአንድነት ጉባኤ በ«መርሐ ግብር» ክፍል ይመዝገብ።</p>
    <div id="list" class="flex flex-col gap-3.5"></div>
    <button class="btn btn-ghost" id="add" type="button" style="height:46px"><span class="ms" style="font-size:20px">add</span>ሌላ ኮርስ ጨምር</button>
  </div>
</main>

<div class="actionbar"><button class="btn btn-primary" type="button" onclick="location.href='weekly-report.html'"><span class="ms" style="font-size:20px">check</span>ጨርሻለሁ</button></div>

<script>
F.repeater({
  list: document.getElementById('list'), addBtn: document.getElementById('add'), title: 'ኮርስ',
  body: d => `
    ${F.text('የኮርሱ ስም', d.topic ?? '', 'ለምሳሌ፡ መሠረተ ሃይማኖት', 'topic')}
    ${F.attendance(d.m ?? 0, d.f ?? 0)}
    ${F.date('ቀን', d.date ?? 'ኅዳር 15, 2019')}
    ${F.batch(d.batch ?? ['1ኛ ባች'])}
    ${F.assignedTeacher(d.tName ?? '', d.present ?? true, d.coverType, d.coverName ?? '', d.reason ?? '')}
    ${F.times([['የታቀደው ሰዓት', d.plan], ['የተጀመረበት', d.start], ['ያለቀበት', d.stop]])}
    ${F.text('ክፍለ ጊዜ', d.session ?? '', '3 ከ 12', '', 'format_list_numbered', '(ከስንት ስንተኛው)')}
    ${F.area('በእለቱ የተሸፈነው ክፍል', d.covered ?? '', 'የተሸፈነውን የትምህርት ክፍል ይጻፉ…')}
    ${F.more(F.area('ምርመራ / አስተያየት', d.note ?? '', 'ተጨማሪ አስተያየት…') + F.problems(), 'አስተያየት እና ችግር')}`,
  summary: c => `${F.val(c, '.topic') || 'ስም አልተጻፈም'} · ${F.chipsOf(c, '.f-batch').join('፣ ')} · ${F.total(c)} ተሳታፊ` + (F.absent(c) ? ' · መምህሩ አልተገኙም' : ''),
  items: [{ topic: 'መሠረተ ሃይማኖት', tType: 'ማ/ቅ መምህር', tName: 'መምህር ዮሐንስ', plan: '11:00 ከቀኑ', start: '11:10 ከቀኑ', stop: '1:00 ማታ', covered: 'ምዕራፍ 2፡ ስለ እግዚአብሔር ባሕርይ', session: '3 ከ 12', batch: ['1ኛ ባች', '2ኛ ባች'], m: 15, f: 17 }],
});
</script>
<script src="assets/section.js"></script>
</body>
</html>
