<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>የሪፖርት ዝርዝር · Report detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/prefs.js"></script>
<style>
.rv{display:flex;gap:12px;padding:14px;align-items:flex-start}
.rv .ic{width:38px;height:38px;border-radius:50%;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rv .ic .ms{font-size:19px}
.rv h4{margin:0;font-size:14.5px;font-weight:600}
.rv p{margin:3px 0 0;font-size:12.5px;color:var(--text-2);line-height:1.55}
.rv.flag{background:#FFFBF3}.rv.flag .ic{background:var(--warn-bg);color:#B26A00}
/* status timeline */
.tl{display:flex;flex-direction:column;gap:0;margin-top:14px;padding-top:12px;border-top:1px solid #fff}
.tl-i{display:flex;gap:10px;position:relative;padding-bottom:12px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:10px;top:22px;bottom:2px;width:1.5px;background:#D6DDE7}
.tl-i:last-child::before{display:none}
.tl-d{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--primary-tint);color:var(--primary)}
.tl-d .ms{font-size:14px}
.tl-i.ok .tl-d{background:var(--ok-bg);color:var(--ok)}
.tl-i.warn .tl-d{background:var(--warn-bg);color:#B26A00}
.tl-i.wait .tl-d{background:#fff;border:1.5px dashed #B7C2D3;color:#8A94A3}
.tl-i b{display:block;font-size:13.5px;font-weight:600}.tl-i small{font-size:12px;color:var(--text-2)}
</style>
</head>
<body>
<header class="appbar"><div class="row">
  <a href="reports.html" class="icon-btn -ml-2 text-inherit" aria-label="ተመለስ" onclick="if (history.length > 1 && document.referrer) { history.back(); return false; }"><span class="ms">arrow_back</span></a>
  <h1>የሪፖርት ዝርዝር</h1>
  <span style="width:40px"></span>
</div></header>

<main class="relative overflow-hidden px-4 pt-[64px] pb-36">
  <div class="glow" style="height:360px"></div>
  <div class="layer flex flex-col gap-3.5">
    <section class="glass" style="padding:16px">
      <div class="flex items-start justify-between gap-3">
        <div><h2 class="m-0 text-[16px] font-semibold">አዲስ አበባ ዩኒቨርሲቲ ግቢ ጉባኤ</h2>
          <p class="m-0 mt-0.5 text-[12.5px] text-[#5B6675]" id="week"></p></div>
        <span id="pill"></span>
      </div>
      <div class="tl" id="tl"></div>
    </section>

    <section id="comment" class="hidden rounded-[16px] p-4" style="background:#FFF8EC;border:1px solid var(--warn-line);color:#8A5200">
      <div class="flex items-center gap-2 font-semibold text-[14px]"><span class="ms" style="font-size:20px">chat</span>የኃላፊ አስተያየት · መ/ር ተስፋዬ አበበ</div>
      <p class="m-0 mt-1.5 text-[13.5px] leading-relaxed" style="color:#6B4300">በመርሐ ግብር 2 ላይ የተሳታፊ ቁጥር በወንድ እና ሴት ተለይቶ አልተጻፈም፤ እባክዎ ይለዩ። መምህሩ ያልተገኙበትን ምክንያት ይጻፉ።</p>
    </section>

    <p class="section-note" id="note"></p>
    <section class="card overflow-hidden" id="rv"></section>
  </div>
</main>

<div class="actionbar hidden" id="bar">
  <a href="weekly-report.html?state=returned" class="btn btn-primary no-underline"><span class="ms" style="font-size:20px">edit</span>አስተካክል እና እንደገና ላክ</a>
</div>

<script>
// demo: ?state=approved (default) | review | resent | returned
const st = new URLSearchParams(location.search).get('state') || 'approved';
const D = {
  approved: { week: 'ጥቅምት 14 – 20, 2019 ዓ.ም · ጥቅምት 3ኛ ሳምንት', pill: ['ok', 'ጸድቋል'],
    tl: [['', 'send', 'ተልኳል', 'ረቡዕ፣ ጥቅምት 25 · ዘግይቶ ገብቷል'], ['', 'visibility', 'ኃላፊው ገምግመውታል', 'ሐሙስ፣ ጥቅምት 26'], ['ok', 'verified', 'ጸድቋል', 'ዓርብ፣ ጥቅምት 27 · መ/ር ተስፋዬ አበበ']] },
  review: { week: 'ጥቅምት 28 – ኅዳር 4, 2019 ዓ.ም · ኅዳር 1ኛ ሳምንት', pill: ['info', 'በግምገማ ላይ'],
    tl: [['', 'send', 'ተልኳል', 'እሑድ፣ ኅዳር 6 · 2:10 ማታ'], ['', 'visibility', 'ኃላፊው እየገመገሙት ነው', 'ማክሰኞ፣ ኅዳር 8'], ['wait', 'hourglass_empty', 'ውሳኔ ይጠበቃል', 'ሲጸድቅ ወይም ሲመለስ ማሳወቂያ ይደርስዎታል']] },
  resent: { week: 'ጥቅምት 21 – 27, 2019 ዓ.ም · ጥቅምት 4ኛ ሳምንት', pill: ['info', 'እንደገና ተልኳል'],
    tl: [['', 'send', 'ተልኳል', 'እሑድ፣ ጥቅምት 29'], ['warn', 'undo', 'ለማስተካከል ተመልሷል', 'ሰኞ፣ ጥቅምት 30'], ['', 'send', 'እንደገና ተልኳል', 'ማክሰኞ፣ ኅዳር 1'], ['wait', 'hourglass_empty', 'ውሳኔ ይጠበቃል', '']] },
  returned: { week: 'ኅዳር 5 – 11, 2019 ዓ.ም · ኅዳር 2ኛ ሳምንት', pill: ['warn', 'ተመልሷል'],
    tl: [['', 'send', 'ተልኳል', 'እሑድ፣ ኅዳር 13 · 3:40 ማታ'], ['warn', 'undo', 'ለማስተካከል ተመልሷል', 'ሐሙስ፣ ኅዳር 17 · መ/ር ተስፋዬ አበበ']] },
}[st];
document.getElementById('week').textContent = D.week;
document.getElementById('pill').outerHTML = `<span class="pill ${D.pill[0]}">${D.pill[1]}</span>`;
document.getElementById('tl').innerHTML = D.tl.map(([c, ic, b, sm]) => `<div class="tl-i ${c}"><span class="tl-d"><span class="ms">${ic}</span></span><div><b>${b}</b>${sm ? `<small>${sm}</small>` : ''}</div></div>`).join('');
const returned = st === 'returned';
document.getElementById('comment').classList.toggle('hidden', !returned);
document.getElementById('bar').classList.toggle('hidden', !returned);
document.getElementById('note').innerHTML = returned
  ? '<span class="ms" style="font-size:16px">info</span>የተጠቆመውን ክፍል አስተካክለው እንደገና ይላኩ።'
  : '<span class="ms" style="font-size:16px">lock</span>የተላከ ሪፖርት ነው፤ ማስተካከል የሚቻለው ኃላፊው ሲመልሱት ብቻ ነው።';

const R = [
  ['calendar_month', 'መርሐ ግብር እና ተሳትፎ', 'መደበኛ፡ ምሥጢረ ሥላሴ · 46 ተሳታፊ<br>የአንድነት፡ የቅዱስ ያሬድ ዜማ · 40 ተሳታፊ'],
  ['menu_book', 'ተከታታይ ኮርሶች', 'መሠረተ ሃይማኖት · 1ኛ፣ 2ኛ ባች · 32 ተሳታፊ'],
  ['translate', 'በሌሎች ቋንቋዎች ኮርሶች', '<span style="color:var(--muted)">በዚህ ሳምንት አልነበረም</span>'],
  ['school', 'ሳምንታዊ ስልጠና', 'የአገልግሎት ሥነ ምግባር · ሥራ አመራር · 42 ተሳታፊ'],
  ['history_edu', 'አብነት እና ግዕዝ', 'ግዕዝ ቋንቋ፣ ቅዳሴ · በሳምንት 3 ቀን · 18 ተማሪዎች'],
  ['music_note', 'የመዝሙር ጥናት', '3 መዝሙራት · 18 ተሳታፊ'],
  ['event_note', 'አጀንዳ እና ውሳኔዎች', '3 አጀንዳዎች ከውሳኔ ጋር'],
  ['help', 'ችግሮች እና መፍትሄዎች', '1 ችግር ከመፍትሄ ጋር'],
  ['add_circle', 'ተጨማሪ ተግባራት', 'የሕሙማን ጉብኝት · 15 ተሳታፊ'],
];
document.getElementById('rv').innerHTML = R.map(([ic, t, body], i) => `
  <div class="rv ${returned && i === 0 ? 'flag' : ''}"><span class="ic"><span class="ms">${ic}</span></span>
    <div class="min-w-0 flex-1"><h4>${t}</h4><p>${body}</p></div>
    ${returned && i === 0 ? '<span class="pill warn">ለማስተካከል</span>' : ''}</div>`).join('<div class="divider mx-3.5"></div>');
</script>
</body>
</html>
