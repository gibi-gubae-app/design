<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>የሳምንቱ ሪፖርት · Weekly report</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/prefs.js"></script>
</head>
<!-- Open with ?state=complete to see the all-filled version -->
<body>
<header class="appbar"><div class="row">
  <a href="home.html" class="icon-btn -ml-2 text-inherit" aria-label="ተመለስ"><span class="ms">arrow_back</span></a>
  <h1 id="title">የሳምንቱ ሪፖርት</h1>
  <span class="pill saved"></span>
</div></header>

<main class="relative overflow-hidden px-5 pt-[72px] pb-44">
  <div class="glow"></div>
  <div class="layer flex flex-col gap-5">
    <section class="glass p-5 flex flex-col gap-4">
      <div class="flex items-start justify-between gap-3">
        <div><h2 class="m-0 font-semibold text-[16px]">አዲስ አበባ ዩኒቨርሲቲ ግቢ ጉባኤ</h2>
          <p class="m-0 mt-1 text-[13px] text-[#5B6675]" id="week"></p></div>
        <span class="pill draft" id="status">ረቂቅ</span>
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex justify-between text-[13px]"><span class="text-[#5B6675]"><b class="text-[#1D3A6B] text-[14px]" id="count"></b> አስፈላጊ ክፍሎች ተሞልተዋል</span><b class="text-[#1D3A6B] text-[14px]" id="pct"></b></div>
        <div class="track"><i id="bar"></i></div>
      </div>
    </section>

    <!-- returned report: the leader's comment -->
    <section id="comment" class="hidden rounded-[16px] p-4" style="background:#FFF8EC;border:1px solid var(--warn-line);color:#8A5200">
      <div class="flex items-center gap-2 font-semibold text-[14px]"><span class="ms" style="font-size:20px">chat</span>የኃላፊ አስተያየት · መ/ር ተስፋዬ አበበ</div>
      <p class="m-0 mt-1.5 text-[13.5px] leading-relaxed" style="color:#6B4300">በመርሐ ግብር 2 ላይ የተሳታፊ ቁጥር በወንድ እና ሴት ተለይቶ አልተጻፈም፤ እባክዎ ይለዩ። መምህሩ ያልተገኙበትን ምክንያት ይጻፉ።</p>
      <p class="m-0 mt-2 text-[12px]" style="color:#A06A1A">ኅዳር 17 ተመልሷል · የተጠቆመውን ክፍል አስተካክለው እንደገና ይላኩ</p>
    </section>

    <section class="card overflow-hidden py-1" id="sections"></section>
  </div>
</main>

<div class="actionbar">
  <p class="m-0 mb-3 text-[13px] text-center" id="hint"></p>
  <button class="btn btn-primary" id="submit">ገምግም እና ላክ <span class="ms" style="font-size:20px">send</span></button>
</div>

<script>
const st = new URLSearchParams(location.search).get('state');
const complete = st === 'complete', returned = st === 'returned';
// [icon, title, summary, state (1 filled · 0 empty · 'none' nothing this week), page, optional]
const S = [
  ['calendar_month','መርሐ ግብር እና ተሳትፎ','2 መርሐ ግብሮች · 86 ተሳታፊ',1,'section-program.html'],
  ['menu_book','ተከታታይ ኮርሶች','1 ኮርስ · 32 ተሳታፊ',1,'section-courses.html'],
  ['translate','በሌሎች ቋንቋዎች ኮርሶች','',  'none','section-languages.html'],
  ['school','ሳምንታዊ ስልጠና','1 ስልጠና · 42 ተሳታፊ',1,'section-training.html'],
  ['history_edu','አብነት እና ግዕዝ','1 የትምህርት ቡድን · 18 ተማሪዎች',0,'section-abinet.html'],
  ['music_note','የመዝሙር ጥናት','1 ጥናት · 3 መዝሙራት',1,'section-mezmur.html'],
  ['event_note','አጀንዳ እና ውሳኔዎች','3 ውሳኔዎች',0,'section-agenda.html'],
  ['help','ችግሮች እና መፍትሄዎች','1 ችግር',0,'section-problems.html'],
  ['add_circle','ተጨማሪ ተግባራት','1 ተግባር · አማራጭ',0,'section-extra.html',true],
];
// the "nothing this week" switch on a section page wins over the demo data
S.forEach(x => { const v = localStorage.getItem('gg-none-' + x[4]); if (v === '1') x[3] = 'none'; else if (v === '0' && x[3] === 'none') x[3] = 1; });

document.getElementById('title').textContent = returned ? 'ሪፖርቱን አስተካክል' : 'የሳምንቱ ሪፖርት';
document.getElementById('week').innerHTML = returned ? 'ኅዳር 5 – 11, 2019 ዓ.ም · ኅዳር 2ኛ ሳምንት' : 'ኅዳር 12 – 18, 2019 ዓ.ም · ኅዳር 3ኛ ሳምንት';
if (returned) {
  const p = document.getElementById('status'); p.className = 'pill warn'; p.textContent = 'ተመልሷል';
  document.getElementById('comment').classList.remove('hidden');
}
const rows = S.map(([ic,t,sub,state,href,optional], i) => {
  if (complete || returned) state = state === 'none' ? 'none' : 1;
  const flag = returned && i === 0;                                   // the part the leader asked to fix
  const none = state === 'none', done = state === 1 || none;
  const subText = flag ? 'ለማስተካከል ተጠቁሟል' : none ? 'በዚህ ሳምንት አልነበረም' : done ? sub : (optional ? 'አማራጭ' : 'አልተሞላም');
  const subCol = flag ? '#B26A00' : done ? 'var(--text-2)' : 'var(--muted)';
  const right = flag
    ? '<span class="pill warn">አስተካክል</span>'
    : done ? `<span class="done-mark"${none ? ' style="background:#EEF1F5;color:#8A94A3"' : ''}><span class="ms">${none ? 'remove' : 'check'}</span></span>`
    : '<span class="ms text-[#8A94A3]" style="font-size:22px">chevron_right</span>';
  const link = href + (state === 'none' && !localStorage.getItem('gg-none-' + href) ? '?none=1' : '');
  return `<a href="${link}" class="flex items-center justify-between gap-3 px-4 min-h-[72px] no-underline text-inherit"${flag ? ' style="background:#FFFBF3"' : ''}>
    <span class="flex items-center gap-3.5 min-w-0"><span class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background:${flag ? 'var(--warn-bg)' : 'var(--primary-tint)'};color:${flag ? '#B26A00' : 'var(--primary)'}"><span class="ms" style="font-size:20px">${ic}</span></span>
    <span class="flex flex-col min-w-0"><span class="font-semibold text-[15px] truncate">${t}</span><span class="text-[13px] truncate" style="color:${subCol}">${subText}</span></span></span>${right}</a>`;
});
document.getElementById('sections').innerHTML = rows.join('<div class="divider mx-4"></div>');
const n = (complete || returned) ? 8 : S.slice(0,8).filter(s => s[3] === 1 || s[3] === 'none').length, pct = Math.round(n/8*100);
document.getElementById('count').textContent = n + '/8';
document.getElementById('pct').textContent = pct + '%';
document.getElementById('bar').style.width = pct + '%';
const submit = document.getElementById('submit');
submit.disabled = n < 8;
if (returned) submit.innerHTML = 'ገምግም እና እንደገና ላክ <span class="ms" style="font-size:20px">send</span>';
submit.onclick = () => location.href = returned ? 'review.html?state=returned' : 'review.html';
document.getElementById('hint').innerHTML = n < 8
  ? '<span style="color:var(--text-2)">ሁሉንም አስፈላጊ ክፍሎች ይሙሉ፤ ያልነበረ ክፍል «አልነበረም» ይበሉ</span>'
  : '<span class="inline-flex items-center gap-1 font-medium" style="color:var(--primary)"><span class="ms fill" style="font-size:16px;color:var(--gold)">check_circle</span>ሁሉም አስፈላጊ ክፍሎች ተሞልተዋል</span>';
</script>
<script src="assets/section.js"></script>
</body>
</html>
